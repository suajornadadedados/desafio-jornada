body:
  - type: markdown
    attributes:
      value: |
        **Este é o lugar de toda dúvida do desafio:** o que o cliente pediu (escopo, prioridades, prazos), como construir (arquitetura, stack, ferramenta, erro) ou como submeter o seu cartão.

        Antes de abrir, dê uma busca por aqui: talvez alguém já tenha passado pela mesma dúvida.

        Quanto mais contexto você der, melhor a resposta. Pergunta vaga recebe resposta vaga.

  - type: input
    id: desafio
    attributes:
      label: Desafio
      description: Em qual desafio você está trabalhando?
      placeholder: "Outubro–Novembro/2026 — Desafio Livre"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: O que você está tentando fazer
      description: Descreva o objetivo, não só o sintoma. Qual o domínio que você escolheu e o que essa parte do sistema precisa entregar?
    validations:
      required: true

  - type: textarea
    id: tentativas
    attributes:
      label: O que você já tentou
      description: Caminhos que testou e por que descartou. Se tem erro, cole a mensagem completa em bloco de código.
      placeholder: |
        Tentei X porque ...
        Não funcionou porque ...

        ```
        cole aqui o erro, se houver
        ```
    validations:
      required: true

  - type: dropdown
    id: assunto
    attributes:
      label: Qual parte do desafio isso toca
      description: Marque o que se aplica. Ajuda quem for responder.
      multiple: true
      options:
        - "Pedido do cliente — entender o que ele quis dizer"
        - "O meu case — negócio, cliente, produto, personas"
        - "Escopo — PRD, SPECs, ADRs"
        - "Arquitetura do projeto"
        - "Estrutura do repositório e Agent Harness"
        - "Processo — branch, PR, commits, validações"
        - "Submissão do cartão à galeria"
        - "Nenhuma / não sei ainda"

  - type: textarea
    id: pergunta
    attributes:
      label: Sua pergunta
      description: Em uma ou duas frases. Se for uma decisão de arquitetura, diga quais opções você está pesando.
    validations:
      required: true

  - type: input
    id: repositorio
    attributes:
      label: Link do seu repositório (opcional)
      description: Se o código já está público, o link acelera muito a ajuda.
      placeholder: "https://github.com/seu-usuario/seu-projeto"
